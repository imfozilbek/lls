# Keeps pinned GitHub Actions and packages up to date. Dependabot PRs run CI without secrets.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: bun
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 3
      ignore:
          # Major versions are upgraded by hand: vitest must stay on 4.x for
          # @cloudflare/vitest-plugin, and vite/react majors need a bundle check.
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
          # React 19.3 adds ~9 KB gzip to the customer bundle (budget 100 KB). Stay on 19.2.x.
          - dependency-name: "react"
            update-types: ["version-update:semver-minor"]
          - dependency-name: "react-dom"
            update-types: ["version-update:semver-minor"]
          - dependency-name: "@types/react"
            update-types: ["version-update:semver-minor"]
          - dependency-name: "@types/react-dom"
            update-types: ["version-update:semver-minor"]
      groups:
          minor-and-patch:
              update-types: [minor, patch]

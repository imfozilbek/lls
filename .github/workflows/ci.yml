name: CI

# Public repository: forks and pull requests run the checks with a read-only token and never see
# secrets. Only main of THIS repository (a push, a manual run or the `deploy` event) reaches the
# deploy job; main only takes pull requests whose checks passed.
# One run per change: a pull request runs the checks (`pull_request`); a push to main deploys.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    # The `deploy` event deploys main again: `gh api -X POST repos/imfozilbek/lls/dispatches
    # -f event_type=deploy`. Only someone with write access can send it, and it always runs the
    # code of main. Its payload is never read.
    repository_dispatch:
        types: [deploy]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    # Checks run only for pull requests, side by side; main gets only the deploy (the code was
    # checked in its PR, and the ruleset makes a PR be up to date with main before merging).
    static:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # Actions are pinned to exact commits: a moved tag cannot swap the code we run.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: No secrets in the repository
              run: ./scripts/check-secrets.sh --all

            - name: No em dashes (owner's decision)
              run: ./scripts/check-dashes.sh --all

            - name: Every e2e spec is in an e2e group below
              run: |
                  for spec in packages/e2e/specs/*.spec.ts; do
                      grep -q "$(basename "$spec")" .github/workflows/ci.yml \
                          || { echo "::error::$spec is in no e2e group of ci.yml"; exit 1; }
                  done

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

    # Every unit test once, with coverage (core: domain ≥ 90%, use cases ≥ 80%; worker: routes ≥ 70%).
    unit:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Core
              run: |
                  bun run --filter @zumda/core build
                  cd packages/core && bunx tsc -p tsconfig.test.json && bun run test:coverage

            - name: App
              run: bun run --filter @zumda/app test

            - name: Worker
              run: bun run --filter @zumda/worker test:coverage

    # The required check `quality-gates`: green only when both jobs above are.
    quality-gates:
        if: always() && github.event_name == 'pull_request'
        needs: [static, unit]
        runs-on: ubuntu-latest
        steps:
            - name: static and unit passed
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  for result in $RESULTS; do
                      [ "$result" = success ] || { echo "::error::a check job: $result"; exit 1; }
                  done

    # Every user path in a real browser against the local stand: wrangler dev with local D1,
    # vite, and a fake Telegram Bot API. No secrets: all tokens here are fake. Eight machines at
    # once, specs grouped to about 20 s each; every spec starts from fresh demo data.
    e2e-group:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                specs:
                    - owner-orders.spec.ts smoke.spec.ts security.spec.ts crashes.spec.ts
                    - owner-shop.spec.ts map.spec.ts owner-bot.spec.ts
                    - money.spec.ts cash.spec.ts
                    - visual.spec.ts
                    - customer-shop.spec.ts gestures.spec.ts sound.spec.ts
                    - showcase.spec.ts managed-bots.spec.ts business-web.spec.ts platform.spec.ts
                    - customer-edges.spec.ts onboarding-admin.spec.ts
                    - courier.spec.ts network.spec.ts trips.spec.ts
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Google Chrome of the runner (playwright.config.ts, CI): no browser download.
            - name: End-to-end
              working-directory: packages/e2e
              env:
                  SPECS: ${{ matrix.specs }}
              run: |
                  # SPECS is word-split on purpose: one argument per spec file.
                  # shellcheck disable=SC2086
                  bunx playwright test $SPECS

    # The required check `e2e`: green only when every group is.
    e2e:
        if: always() && github.event_name == 'pull_request'
        needs: [e2e-group]
        runs-on: ubuntu-latest
        steps:
            - name: every e2e group passed
              env:
                  RESULT: ${{ needs.e2e-group.result }}
              run: '[ "$RESULT" = success ] || { echo "::error::e2e: $RESULT"; exit 1; }'

    deploy:
        # Never for pull requests or forks: only main of this repository, pushed, run by hand or
        # by the `deploy` event. No re-check here: main only takes PRs whose checks passed on
        # code up to date with main.
        if: >-
            github.repository == 'imfozilbek/lls' &&
            github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
            github.event_name == 'repository_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production
        concurrency:
            group: deploy
            cancel-in-progress: false
        steps:
            - name: Check secrets
              id: secrets
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PLATFORM_BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
                  PLATFORM_ADMIN_IDS: ${{ secrets.PLATFORM_ADMIN_IDS }}
                  COURIER_BOT_TOKEN: ${{ secrets.COURIER_BOT_TOKEN }}
                  BUSINESS_BOT_TOKEN: ${{ secrets.BUSINESS_BOT_TOKEN }}
              run: |
                  missing=""
                  for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PLATFORM_BOT_TOKEN PLATFORM_ADMIN_IDS COURIER_BOT_TOKEN BUSINESS_BOT_TOKEN; do
                      if [ -z "${!name}" ]; then missing="$missing $name"; fi
                  done
                  if [ -n "$missing" ]; then
                      echo "::notice::Deploy skipped. Add GitHub secrets:$missing (see docs/launch-checklist.md)"
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: steps.secrets.outputs.ready == 'true'
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              if: steps.secrets.outputs.ready == 'true'
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              if: steps.secrets.outputs.ready == 'true'
              with:
                  node-version: "22"

            # No secrets here: package install scripts never see them.
            - name: Install and build core
              if: steps.secrets.outputs.ready == 'true'
              run: |
                  bun install --frozen-lockfile
                  bun run --filter @zumda/core build

            # The only step that gets the secrets.
            - name: Deploy to Cloudflare
              if: steps.secrets.outputs.ready == 'true'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PLATFORM_BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
                  PLATFORM_ADMIN_IDS: ${{ secrets.PLATFORM_ADMIN_IDS }}
                  COURIER_BOT_TOKEN: ${{ secrets.COURIER_BOT_TOKEN }}
                  BUSINESS_BOT_TOKEN: ${{ secrets.BUSINESS_BOT_TOKEN }}
                  # Optional saved copy of the encryption key (SECURITY.md, "Encryption key").
                  TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
                  # Optional: trips' way along the roads (OpenRouteService, key from account.heigit.org).
                  ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
              run: .github/scripts/deploy.sh

name: CI

# Public repository: forks and pull requests run the checks with a read-only token and never see
# secrets. Only a push to main of THIS repository, after green checks, reaches the deploy job.
on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    quality-gates:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            # Actions are pinned to exact commits: a moved tag cannot swap the code we run.
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: No secrets in the repository
              run: ./scripts/check-secrets.sh --all

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

            - name: Test
              run: bun run test

            - name: Core coverage (domain ≥ 90%, use cases ≥ 80%)
              run: bun run --filter @lls/core test:coverage

            - name: Worker coverage (routes ≥ 70%)
              run: bun run --filter @lls/worker test:coverage

    deploy:
        needs: quality-gates
        # Never for pull requests or forks: only main of this repository, pushed or run by hand.
        if: >-
            github.repository == 'imfozilbek/lls' &&
            github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production
        concurrency:
            group: deploy
            cancel-in-progress: false
        steps:
            - name: Check secrets
              id: secrets
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PLATFORM_BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
                  PLATFORM_ADMIN_IDS: ${{ secrets.PLATFORM_ADMIN_IDS }}
              run: |
                  missing=""
                  for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PLATFORM_BOT_TOKEN PLATFORM_ADMIN_IDS; do
                      if [ -z "${!name}" ]; then missing="$missing $name"; fi
                  done
                  if [ -n "$missing" ]; then
                      echo "::notice::Deploy skipped. Add GitHub secrets:$missing (see docs/launch-checklist.md)"
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              if: steps.secrets.outputs.ready == 'true'
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              if: steps.secrets.outputs.ready == 'true'
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              if: steps.secrets.outputs.ready == 'true'
              with:
                  node-version: "22"

            # No secrets here: package install scripts never see them.
            - name: Install and build core
              if: steps.secrets.outputs.ready == 'true'
              run: |
                  bun install --frozen-lockfile
                  bun run --filter @lls/core build

            # The only step that gets the secrets.
            - name: Deploy to Cloudflare
              if: steps.secrets.outputs.ready == 'true'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PLATFORM_BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
                  PLATFORM_ADMIN_IDS: ${{ secrets.PLATFORM_ADMIN_IDS }}
              run: .github/scripts/deploy.sh

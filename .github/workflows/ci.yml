name: CI

# Public repository: forks and pull requests run the checks with a read-only token and never see
# secrets. Only main of THIS repository (a push, a manual run or the `deploy` event), after green
# checks, reaches the deploy job.
# One run per change: a pull request runs on `pull_request`, and `push` only for main (the merged
# code, before the deploy). A push to a PR branch would otherwise run everything twice.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    # The `deploy` event deploys main again: `gh api -X POST repos/imfozilbek/lls/dispatches
    # -f event_type=deploy`. Only someone with write access can send it, and it always runs the
    # code of main. Its payload is never read.
    repository_dispatch:
        types: [deploy]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    quality-gates:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            # Actions are pinned to exact commits: a moved tag cannot swap the code we run.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: No secrets in the repository
              run: ./scripts/check-secrets.sh --all

            - name: No em dashes (owner's decision)
              run: ./scripts/check-dashes.sh --all

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

            - name: Test
              run: bun run test

            - name: Core coverage (domain ≥ 90%, use cases ≥ 80%)
              run: bun run --filter @zumda/core test:coverage

            - name: Worker coverage (routes ≥ 70%)
              run: bun run --filter @zumda/worker test:coverage

    # Every user path in a real browser against the local stand: wrangler dev with local D1,
    # vite, and a fake Telegram Bot API. No secrets: all tokens here are fake.
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # The Playwright of packages/e2e: its version matches the browser it downloads.
            - name: Install Chromium
              run: bun run --cwd packages/e2e browsers

            - name: End-to-end
              run: bun run e2e

    deploy:
        needs: [quality-gates, e2e]
        # Never for pull requests or forks: only main of this repository, pushed, run by hand or
        # by the `deploy` event.
        if: >-
            github.repository == 'imfozilbek/lls' &&
            github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
            github.event_name == 'repository_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production
        concurrency:
            group: deploy
            cancel-in-progress: false
        steps:
            - name: Check secrets
              id: secrets
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PLATFORM_BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
                  PLATFORM_ADMIN_IDS: ${{ secrets.PLATFORM_ADMIN_IDS }}
                  COURIER_BOT_TOKEN: ${{ secrets.COURIER_BOT_TOKEN }}
              run: |
                  missing=""
                  for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PLATFORM_BOT_TOKEN PLATFORM_ADMIN_IDS COURIER_BOT_TOKEN; do
                      if [ -z "${!name}" ]; then missing="$missing $name"; fi
                  done
                  if [ -n "$missing" ]; then
                      echo "::notice::Deploy skipped. Add GitHub secrets:$missing (see docs/launch-checklist.md)"
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: steps.secrets.outputs.ready == 'true'
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              if: steps.secrets.outputs.ready == 'true'
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              if: steps.secrets.outputs.ready == 'true'
              with:
                  node-version: "22"

            # No secrets here: package install scripts never see them.
            - name: Install and build core
              if: steps.secrets.outputs.ready == 'true'
              run: |
                  bun install --frozen-lockfile
                  bun run --filter @zumda/core build

            # The only step that gets the secrets.
            - name: Deploy to Cloudflare
              if: steps.secrets.outputs.ready == 'true'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  PLATFORM_BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
                  PLATFORM_ADMIN_IDS: ${{ secrets.PLATFORM_ADMIN_IDS }}
                  COURIER_BOT_TOKEN: ${{ secrets.COURIER_BOT_TOKEN }}
                  # Optional saved copy of the encryption key (SECURITY.md, "Encryption key").
                  TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
              run: .github/scripts/deploy.sh

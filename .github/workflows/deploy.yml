name: Deploy

# Runs after CI passes on main, or by hand (Actions → Deploy → Run workflow).
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            PLATFORM_BOT_TOKEN: ${{ secrets.PLATFORM_BOT_TOKEN }}
            PLATFORM_ADMIN_IDS: ${{ secrets.PLATFORM_ADMIN_IDS }}
        steps:
            - name: Check secrets
              id: secrets
              run: |
                  missing=""
                  for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PLATFORM_BOT_TOKEN PLATFORM_ADMIN_IDS; do
                      if [ -z "${!name}" ]; then missing="$missing $name"; fi
                  done
                  if [ -n "$missing" ]; then
                      echo "::notice::Deploy skipped. Add GitHub secrets:$missing (see docs/launch-checklist.md)"
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@v4
              if: steps.secrets.outputs.ready == 'true'
              with:
                  # workflow_run starts on main's latest commit; deploy exactly the one CI checked.
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - uses: oven-sh/setup-bun@v2
              if: steps.secrets.outputs.ready == 'true'
              with:
                  bun-version: "1.3.11"

            - uses: actions/setup-node@v4
              if: steps.secrets.outputs.ready == 'true'
              with:
                  node-version: "22"

            - name: Install and build core
              if: steps.secrets.outputs.ready == 'true'
              run: |
                  bun install --frozen-lockfile
                  bun run --filter @lls/core build

            - name: Deploy to Cloudflare
              if: steps.secrets.outputs.ready == 'true'
              run: .github/scripts/deploy.sh

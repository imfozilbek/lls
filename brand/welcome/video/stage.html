<!doctype html>
<html lang="uz">
    <head>
        <meta charset="utf-8" />
        <title>Zumda: ro'yxatdan o'tish</title>
        <style>
            @font-face {
                font-family: Rubik;
                src: url(assets/rubik.woff2) format("woff2");
                font-weight: 300 900;
            }
            :root {
                --green: #15803d;
                --deep: #14532d;
                --mint: #dcfce7;
                --mint2: #bbf7d0;
                --tg-blue: #3390ec;
                --ui:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                    sans-serif;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1080px;
                height: 1920px;
                overflow: hidden;
                background: #0d3a1f;
            }
            #stage {
                position: relative;
                width: 1080px;
                height: 1920px;
                overflow: hidden;
                font-family: Rubik, var(--ui);
                color: #fff;
                background: radial-gradient(
                    1300px 1000px at 50% 42%,
                    #1a7a40 0%,
                    #145a30 46%,
                    #0d3a1f 100%
                );
            }
            .blob {
                position: absolute;
                border-radius: 50%;
                filter: blur(90px);
                opacity: 0.32;
            }
            #blob1 {
                width: 620px;
                height: 620px;
                background: #22c55e;
            }
            #blob2 {
                width: 520px;
                height: 520px;
                background: #dcfce7;
                opacity: 0.14;
            }
            .abs {
                position: absolute;
            }

            /* Top bar */
            #top {
                left: 64px;
                right: 64px;
                top: 64px;
                height: 64px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            #top img {
                height: 52px;
            }
            #rolechip {
                font-size: 30px;
                font-weight: 500;
                color: var(--mint2);
                padding: 12px 26px;
                border-radius: 40px;
                background: rgba(220, 252, 231, 0.12);
            }

            /* Caption */
            #caps {
                left: 64px;
                right: 64px;
                top: 170px;
                height: 230px;
            }
            .cap {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
            }
            .cap .who {
                font-size: 30px;
                font-weight: 500;
                color: var(--mint2);
                display: flex;
                align-items: center;
                gap: 14px;
                height: 44px;
            }
            .cap .who i {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #4ade80;
                display: inline-block;
            }
            .cap .line {
                margin-top: 14px;
                display: flex;
                gap: 22px;
                align-items: flex-start;
            }
            .cap .n {
                flex: none;
                width: 66px;
                height: 66px;
                border-radius: 50%;
                background: var(--mint);
                color: var(--deep);
                font-size: 36px;
                font-weight: 700;
                display: grid;
                place-items: center;
                margin-top: 2px;
            }
            .cap .t {
                font-size: 54px;
                font-weight: 700;
                line-height: 1.14;
                letter-spacing: -0.01em;
                text-wrap: balance;
            }

            /* Progress */
            #dots {
                left: 0;
                right: 0;
                top: 1868px;
                display: flex;
                justify-content: center;
                gap: 12px;
            }
            #dots b {
                height: 10px;
                width: 10px;
                border-radius: 6px;
                background: rgba(220, 252, 231, 0.28);
                display: block;
            }
            #dots b.on {
                width: 46px;
                background: var(--mint);
            }

            /* Phone */
            #phone {
                left: 231px;
                top: 405px;
                width: 412px;
                height: 962px;
                transform-origin: 0 0;
            }
            .bezel {
                width: 412px;
                height: 962px;
                border-radius: 60px;
                background: #0b0f0d;
                padding: 11px;
                box-shadow:
                    0 40px 90px rgba(0, 0, 0, 0.45),
                    inset 0 0 0 2px #2a302d;
            }
            .screen {
                position: relative;
                width: 390px;
                height: 940px;
                border-radius: 49px;
                overflow: hidden;
                background: #fff;
                font-family: var(--ui);
                color: #000;
            }
            .status {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: 44px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 6px 30px 0 34px;
                font-size: 15px;
                font-weight: 600;
                z-index: 30;
                background: #fff;
            }
            .status svg {
                display: block;
            }
            .island {
                position: absolute;
                left: 50%;
                top: 9px;
                width: 108px;
                height: 30px;
                margin-left: -54px;
                border-radius: 20px;
                background: #000;
                z-index: 31;
            }
            .content {
                position: absolute;
                left: 0;
                top: 44px;
                width: 390px;
                height: 896px;
                overflow: hidden;
            }
            .layer {
                position: absolute;
                left: 0;
                top: 0;
                width: 390px;
                height: 896px;
            }

            /* Telegram chat */
            .chat {
                background: #fff;
            }
            .tghead {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: 56px;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 12px;
                background: #f7f7f7;
                border-bottom: 1px solid #e3e3e3;
                z-index: 2;
            }
            .tghead .back {
                color: var(--tg-blue);
                font-size: 30px;
                line-height: 1;
                width: 18px;
                margin-top: -4px;
            }
            .tghead img {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                object-fit: cover;
            }
            .tghead b {
                display: block;
                font-size: 16px;
                font-weight: 600;
            }
            .tghead small {
                display: block;
                font-size: 13px;
                color: #8a8a8e;
                margin-top: 1px;
            }
            .msgs {
                position: absolute;
                left: 0;
                right: 0;
                top: 56px;
                bottom: 54px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 6px 8px 8px;
                background: linear-gradient(165deg, #dbe7c4 0%, #c7dcae 45%, #b2cf97 100%);
            }
            .msgs::before {
                content: "";
                position: absolute;
                inset: 0;
                opacity: 0.22;
                background-image:
                    radial-gradient(circle at 20px 20px, #7fa86a 2px, transparent 2.5px),
                    radial-gradient(circle at 60px 50px, #7fa86a 1.5px, transparent 2px);
                background-size: 80px 80px;
            }
            .wrap {
                position: relative;
                overflow: hidden;
                flex: none;
            }
            .inner {
                padding-top: 6px;
            }
            .bub {
                position: relative;
                max-width: 300px;
                background: #fff;
                border-radius: 16px 16px 16px 5px;
                padding: 7px 11px 6px;
                font-size: 15.5px;
                line-height: 1.32;
                box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
                width: fit-content;
            }
            .bub.out {
                margin-left: auto;
                background: #effdde;
                border-radius: 16px 16px 5px 16px;
            }
            .bub.photo {
                padding: 0;
                overflow: hidden;
                width: 300px;
            }
            .bub.photo img {
                display: block;
                width: 300px;
                height: 168px;
                object-fit: cover;
            }
            .bub.photo .cap2 {
                padding: 7px 11px 6px;
            }
            .bub .tm {
                float: right;
                font-size: 11.5px;
                color: #8a8a8e;
                margin: 6px 0 -4px 10px;
            }
            .bub.out .tm {
                color: #4fae4e;
            }
            .bub a {
                color: var(--tg-blue);
                text-decoration: none;
            }
            .kb {
                width: 300px;
                margin-top: 4px;
                display: grid;
                gap: 4px;
            }
            .kb .row {
                display: flex;
                gap: 4px;
            }
            .kb .btn {
                flex: 1;
                height: 40px;
                border-radius: 10px;
                background: rgba(48, 77, 36, 0.36);
                color: #fff;
                font-size: 14.5px;
                font-weight: 600;
                display: grid;
                place-items: center;
                text-align: center;
                padding: 0 6px;
            }
            .typing {
                width: 64px;
                height: 36px;
                display: flex;
                gap: 5px;
                align-items: center;
                justify-content: center;
            }
            .typing i {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #9aa69a;
                display: block;
            }
            .contact {
                display: flex;
                gap: 10px;
                align-items: center;
                padding-right: 30px;
            }
            .contact .av {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: #4fae4e;
                color: #fff;
                font-weight: 600;
                font-size: 19px;
                display: grid;
                place-items: center;
            }
            .contact b {
                display: block;
                font-size: 15.5px;
            }
            .contact span {
                font-size: 14px;
                color: #4fae4e;
            }
            .inputbar {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 54px;
                background: #f7f7f7;
                border-top: 1px solid #e3e3e3;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 12px;
            }
            .inputbar .field {
                flex: 1;
                height: 36px;
                border-radius: 18px;
                background: #fff;
                border: 1px solid #dedede;
                color: #9a9a9e;
                font-size: 16px;
                display: flex;
                align-items: center;
                padding: 0 14px;
            }
            .inputbar .ic {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid #8a8a8e;
            }
            .replykb {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 128px;
                background: #d6d8de;
                padding: 10px 8px;
                display: none;
            }
            .replykb .field {
                height: 36px;
                border-radius: 18px;
                background: #fff;
                color: #9a9a9e;
                font-size: 16px;
                display: flex;
                align-items: center;
                padding: 0 14px;
                margin-bottom: 12px;
            }
            .replykb .key {
                height: 52px;
                border-radius: 10px;
                background: #fff;
                box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
                font-size: 17px;
                font-weight: 500;
                display: grid;
                place-items: center;
            }

            /* Mini App */
            .app {
                background: #fff;
            }
            .apphead {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: 52px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                background: #fff;
                border-bottom: 1px solid #ececec;
                z-index: 3;
            }
            .apphead .close {
                color: var(--tg-blue);
                font-size: 16px;
            }
            .apphead b {
                font-size: 16px;
                font-weight: 600;
            }
            .apphead .more {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 1.8px solid #8a8a8e;
                display: grid;
                place-items: center;
                font-size: 14px;
                color: #8a8a8e;
                line-height: 0;
            }
            .view {
                position: absolute;
                left: 0;
                top: 52px;
                width: 390px;
                height: 844px;
                overflow: hidden;
                background: #fff;
            }
            .view img {
                position: absolute;
                left: 0;
                top: 0;
                width: 390px;
                height: 844px;
            }
            .shade {
                position: absolute;
                inset: 0;
                background: #000;
                pointer-events: none;
            }

            /* Telegram's own windows */
            .sheetbg {
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.42);
            }
            .sheet {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                background: #fff;
                border-radius: 18px 18px 0 0;
                padding: 10px 20px 26px;
            }
            .grab {
                width: 38px;
                height: 5px;
                border-radius: 3px;
                background: #d4d4d8;
                margin: 0 auto 16px;
            }
            .sheet h3 {
                margin: 0 0 4px;
                font-size: 20px;
                text-align: center;
            }
            .sheet .sub {
                text-align: center;
                color: #8a8a8e;
                font-size: 14.5px;
                margin-bottom: 18px;
            }
            .sheet .botav {
                width: 86px;
                height: 86px;
                border-radius: 50%;
                margin: 0 auto 18px;
                background: #e8f5ec;
                display: grid;
                place-items: center;
                color: var(--green);
            }
            .sheet .fld {
                border-radius: 12px;
                background: #f2f2f7;
                padding: 10px 14px;
                margin-bottom: 10px;
            }
            .sheet .fld small {
                display: block;
                font-size: 12.5px;
                color: #8a8a8e;
            }
            .sheet .fld span {
                font-size: 17px;
            }
            .sheet .ok {
                color: #2fa84f;
                font-size: 13.5px;
                margin: -2px 0 14px 4px;
            }
            .sheet .note {
                font-size: 13.5px;
                color: #6d6d72;
                margin: 4px 4px 18px;
                line-height: 1.35;
            }
            .sheet .go {
                height: 50px;
                border-radius: 12px;
                background: var(--tg-blue);
                color: #fff;
                font-size: 17px;
                font-weight: 600;
                display: grid;
                place-items: center;
            }
            .dialog {
                position: absolute;
                left: 45px;
                width: 300px;
                top: 330px;
                background: #fff;
                border-radius: 16px;
                padding: 20px 20px 8px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            }
            .dialog h4 {
                margin: 0 0 8px;
                font-size: 18px;
            }
            .dialog p {
                margin: 0 0 14px;
                font-size: 15px;
                color: #3c3c43;
                line-height: 1.35;
            }
            .dialog .acts {
                display: flex;
                justify-content: flex-end;
                gap: 6px;
            }
            .dialog .acts span {
                font-size: 15.5px;
                font-weight: 600;
                color: var(--tg-blue);
                padding: 10px 12px;
            }

            /* Finger */
            #finger {
                position: absolute;
                width: 50px;
                height: 50px;
                margin: -25px 0 0 -25px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.55);
                border: 2.5px solid rgba(255, 255, 255, 0.95);
                box-shadow:
                    0 4px 16px rgba(0, 0, 0, 0.28),
                    inset 0 0 0 9px rgba(21, 128, 61, 0.18);
                z-index: 50;
            }
            #ripple {
                position: absolute;
                border-radius: 50%;
                border: 3px solid rgba(21, 128, 61, 0.75);
                z-index: 49;
            }

            /* Cards */
            .full {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }
            .tile {
                width: 210px;
                height: 210px;
                border-radius: 56px;
                background: var(--mint);
                color: var(--green);
                display: grid;
                place-items: center;
            }
            .tile svg {
                width: 118px;
                height: 118px;
            }
            #card .num {
                margin-top: 56px;
                font-size: 36px;
                font-weight: 500;
                color: var(--mint2);
            }
            #card .name {
                margin-top: 10px;
                font-size: 110px;
                font-weight: 800;
                letter-spacing: -0.02em;
                line-height: 1;
            }
            #card .sub {
                margin-top: 26px;
                font-size: 42px;
                color: rgba(255, 255, 255, 0.82);
            }
            .solo #intro .logo {
                width: 430px;
            }
            .solo #intro h1 {
                font-size: 70px;
                margin-top: 56px;
                max-width: 940px;
                text-wrap: balance;
            }
            .solo #outro h2 {
                max-width: 900px;
                text-wrap: balance;
                line-height: 1.12;
            }
            .solo .rows {
                margin-top: 64px;
                gap: 14px;
                width: 860px;
            }
            .row3.compact {
                padding: 16px 26px;
                border-radius: 26px;
                gap: 24px;
            }
            .row3.compact .num {
                flex: none;
                width: 58px;
                height: 58px;
                border-radius: 50%;
                background: var(--mint);
                color: var(--deep);
                font-size: 30px;
                font-weight: 700;
                display: grid;
                place-items: center;
            }
            .row3.compact b {
                font-size: 34px;
                font-weight: 600;
                line-height: 1.2;
            }
            #intro .logo {
                width: 600px;
            }
            #intro h1 {
                margin: 70px 0 0;
                font-size: 80px;
                font-weight: 800;
                letter-spacing: -0.02em;
                line-height: 1.05;
            }
            #intro .sub {
                margin-top: 22px;
                font-size: 40px;
                color: var(--mint2);
            }
            .rows {
                margin-top: 80px;
                display: grid;
                gap: 26px;
                width: 760px;
            }
            .row3 {
                display: flex;
                align-items: center;
                gap: 30px;
                text-align: left;
                padding: 24px 30px;
                border-radius: 34px;
                background: rgba(220, 252, 231, 0.1);
            }
            .row3 .ic {
                width: 96px;
                height: 96px;
                border-radius: 28px;
                background: var(--mint);
                color: var(--green);
                display: grid;
                place-items: center;
                flex: none;
            }
            .row3 .ic svg {
                width: 56px;
                height: 56px;
            }
            .row3 .ic img {
                width: 96px;
                height: 96px;
                border-radius: 28px;
            }
            .row3 b {
                display: block;
                font-size: 44px;
                font-weight: 700;
            }
            .row3 span {
                display: block;
                font-size: 30px;
                color: var(--mint2);
                margin-top: 4px;
            }
            #outro .logo {
                width: 640px;
            }
            #app {
                z-index: 5;
            }
            #sheets {
                z-index: 6;
            }
            #outro h2 {
                margin: 64px 0 0;
                font-size: 62px;
                font-weight: 800;
                letter-spacing: -0.02em;
            }
            #outro .site {
                margin-top: 70px;
                font-size: 46px;
                font-weight: 700;
                color: var(--mint);
                padding: 18px 46px;
                border-radius: 60px;
                border: 3px solid rgba(220, 252, 231, 0.5);
            }
        </style>
    </head>
    <body>
        <div id="stage">
            <div id="blob1" class="blob"></div>
            <div id="blob2" class="blob"></div>

            <div id="top" class="abs">
                <img src="assets/logo-white.svg" alt="" />
                <div id="rolechip"></div>
            </div>
            <div id="caps" class="abs">
                <div class="cap" id="capA"></div>
                <div class="cap" id="capB"></div>
            </div>
            <div id="dots" class="abs"></div>

            <div id="phone" class="abs">
                <div class="bezel">
                    <div class="screen">
                        <div class="status">
                            <span>9:41</span>
                            <svg width="70" height="13" viewBox="0 0 70 13">
                                <g fill="#000">
                                    <rect x="0" y="8" width="3.4" height="5" rx="1" />
                                    <rect x="5" y="5.5" width="3.4" height="7.5" rx="1" />
                                    <rect x="10" y="3" width="3.4" height="10" rx="1" />
                                    <rect x="15" y="0" width="3.4" height="13" rx="1" />
                                </g>
                                <path
                                    d="M29 4.2a10 10 0 0 1 13 0l-1.6 1.7a7.6 7.6 0 0 0-9.8 0zM31.6 7a6.2 6.2 0 0 1 7.8 0l-1.7 1.7a3.8 3.8 0 0 0-4.4 0zM35.5 12.6l-2-2a2.8 2.8 0 0 1 4 0z"
                                    fill="#000"
                                />
                                <rect
                                    x="45.5"
                                    y="1"
                                    width="21"
                                    height="11"
                                    rx="3.4"
                                    fill="none"
                                    stroke="#000"
                                    stroke-opacity=".4"
                                />
                                <rect x="47.5" y="3" width="15" height="7" rx="1.8" fill="#000" />
                                <rect
                                    x="67.6"
                                    y="4.2"
                                    width="1.8"
                                    height="4.6"
                                    rx=".9"
                                    fill="#000"
                                    fill-opacity=".45"
                                />
                            </svg>
                        </div>
                        <div class="island"></div>
                        <div class="content" id="content">
                            <div id="chats"></div>
                            <div class="layer app" id="app">
                                <div class="apphead">
                                    <span class="close">✕ Yopish</span><b id="apptitle"></b
                                    ><span class="more">···</span>
                                </div>
                                <div class="view">
                                    <img id="imgB" alt="" />
                                    <div class="shade" id="shadeB"></div>
                                    <img id="imgA" alt="" />
                                    <div class="shade" id="shadeA"></div>
                                    <img id="imgTop" alt="" />
                                </div>
                            </div>
                            <div class="layer" id="sheets"></div>
                            <div id="ripple"></div>
                            <div id="finger"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="card" class="full">
                <div class="tile" id="cardicon"></div>
                <div class="num" id="cardnum"></div>
                <div class="name" id="cardname"></div>
                <div class="sub" id="cardsub"></div>
            </div>

            <div id="intro" class="full">
                <img class="logo" src="assets/logo-white.svg" alt="" />
                <h1>Zumdada ro'yxatdan o'tish</h1>

                x = clamp(x)

            }
            const inOut = (x) => {

                const OUTRO = SOLO ? 5.2 : 6.0
                const steps = []

                let T = INTRO
                let role = null
                let lastImg = null
                let baseChat = null
                let capN = 0
                function startRole(r) {
                    role = {
                        index: r,
                        cardStart: T,
                        bodyStart: T + CARD,
                        steps: [],
                        caps: 0,
                    }
                    roles.push(role)
                    T += CARD
                    lastImg = null
                    baseChat = null
                    capN = 0
                }
                function endRole() {
                    role.bodyEnd = T
                    T += 0.35
                }
                function step(s) {
                    s.role = role.index
                    s.start = T
                    s.end = T + s.dur
                    T = s.end
                    if (s.caption) {
                        capN += 1
                        s.capN = capN
                        role.caps = capN
                    }
                    s.prev = steps.length && steps.at(-1).role === role.index ? steps.at(-1) : null
                    if (s.kind === "chat") {
                        baseChat = s.chat
                    }
                    s.baseChat = baseChat
                    s.overChat = s.kind === "sheet" && s.prev?.kind === "chat"
                    if (s.kind === "app") {
                        s.prevImg = lastImg
                        lastImg = s.img
                    }
                    if (s.kind === "sheet") {
                        s.img = lastImg
                        s.prevImg = lastImg
                    }
                    if (s.kind === "chat") {
                        s.img = lastImg
                    }
                    for (const a of s.adds ?? []) {
                        msgById[a.id].at = s.start + a.at
                        msgById[a.id].typing = a.typing ?? msgById[a.id].typing
                    }
                    if (s.tap === "auto") {
                        s.tap = taps[s.img]
                    }
                    steps.push(s)
                    role.steps.push(s)
                    return s
                }
                const app = (img, dur, enter, extra = {}) =>
                    step({ kind: "app", img, dur, enter, tap: "auto", ...extra })

                // 1. Biznes egasi

                    }
                    if (s.kind === "app" && s.title) {
                        title = s.title
                    }
                    if (s.kind === "app" && !s.title && !title) {
                        title = "Zumda | Business"
                    }
                    s.appTitle = s.kind === "app" ? (s.title ?? title) : title
                    title = s.appTitle
                    who = s.who ?? who
                    s.whoNow = who
                    if (s.caption) {
                        capStep = s
                    }
                    s.capStep = capStep
                }

                /* ---------- Intro / outro rows ---------- */
                if (SOLO) {
                    document.querySelector("#intro h1").textContent = SOLO_ROLE.title
                    document.querySelector("#intro .sub").textContent = SOLO_ROLE.sub
                    document.querySelector("#outro h2").textContent = SOLO_ROLE.action
                }
                $("introrows").innerHTML = SOLO
                    ? SOLO_ROLE.steps
                          .map(
                              (text, i) =>
                                  `<div class="row3 compact" id="ir${i}"><div class="num">${i + 1}</div><b>${text}</b></div>`,
                          )
                          .join("")
                    : ROLES.map(
                          (r, i) =>
                              `<div class="row3" id="ir${i}"><div class="ic">${svg(r.icon)}</div><div><b>${r.name}</b><span>${r.sub}</span></div></div>`,
                      ).join("")
                $("outrorows").innerHTML = (
                    SOLO
                        ? [SOLO_ROLE.bot]
                        : [
                              [
                                  "assets/zumda-business-avatar.png",
                                  "@zumdashop_business_bot",
                                  "Biznes egasi uchun",
                              ],
                              [
                                  "assets/zumda-kuryer-avatar.png",
                                  "@zumdashop_kuryer_bot",
                                  "Kuryer uchun",
                              ],
                              [
                                  "assets/zumda-bot-avatar.png",
                                  "@zumdashop_bot",
                                  "Mijoz uchun: barcha do'konlar",
                              ],
                          ]
                )
                    .map(
                        ([img, h, s], i) =>
                            `<div class="row3" id="or${i}"><div class="ic"><img src="${img}"></div><div><b style="font-size:38px">${h}</b><span>${s}</span></div></div>`,
                    )
                    .join("")

                /* ---------- Wait for everything ---------- */
                const imgs = new Set(steps.map((s) => s.img).filter(Boolean))
                const cache = {}
                for (const f of imgs) cache[f] = `shots2/${f}`
                await document.fonts.ready
                await Promise.all([...document.images].map((im) => im.decode().catch(() => null)))
                for (const m of Object.values(msgById)) {
                    m.h = m.inner.offsetHeight
                    m.th = m.typingEl.offsetHeight
                }

                /* ---------- Render ---------- */
                const set = (el, css) => {
                    for (const [k, v] of Object.entries(css)) el.style[k] = v
                }
                const imgA = $("imgA"),
                    imgB = $("imgB"),
                    imgTop = $("imgTop")
                const pending = []
                const setSrc = (el, f) => {
                    const src = f ? cache[f] : ""
                    if (el.dataset.f !== (f ?? "")) {
                        el.dataset.f = f ?? ""
                        el.src = src
                        if (f) pending.push(el.decode().catch(() => null))
                    }
                    el.style.display = f ? "block" : "none"
                }

                function posOf(el) {
                    let x = 0,
                        y = 0
                    const content = $("content")
                    while (el && el !== content) {
                        x += el.offsetLeft
                        y += el.offsetTop
                        el = el.offsetParent
                    }
                    return { x, y }
                }
                function tapPoint(s) {
                    if (!s.tap) return null
                    if (s.tap.sel) {
                        const el = $(s.tap.sel)
                        const p = posOf(el)
                        return {
                            x: p.x + el.offsetWidth / 2,
                            y: p.y + el.offsetHeight / 2,
                        }
                    }
                    return { x: s.tap.x, y: s.tap.y + 52 }
                }

                function renderChats(t, s, u) {
                    const chats = Object.keys(MSGS)
                    for (const c of chats) {
                        $(`chat-${c}`).style.opacity = "0"
                        $(`chat-${c}`).style.zIndex = "0"
                    }
                    const cur = s.baseChat
                    const prev = s.prev?.baseChat
                    if (cur) {
                        let o = 1
                        if (
                            s.kind === "chat" &&
                            s.enter === "fade" &&
                            prev &&
                            prev !== cur &&
                            s.prev?.kind !== "app"
                        ) {
                            $(`chat-${prev}`).style.opacity = "1"
                            $(`chat-${prev}`).style.zIndex = "1"
                            o = outQuart(u / TR)
                        }
                        $(`chat-${cur}`).style.opacity = String(o)
                        $(`chat-${cur}`).style.zIndex = "2"
                    }
                    for (const m of Object.values(msgById)) {
                        const typeAt = m.typing ? m.at - 0.75 : m.at
                        if (t < typeAt) {
                            m.wrap.style.height = "0px"
                            m.wrap.style.display = "none"
                            continue
                        }
                        m.wrap.style.display = "block"
                        if (t < m.at) {
                            const p = outQuart((t - typeAt) / 0.25)
                            m.wrap.style.height = `${m.th * p}px`
                            set(m.typingEl, { opacity: String(p), display: "block" })
                            m.inner.style.opacity = "0"
                            m.typingEl.querySelectorAll("i").forEach((d, i) => {
                                d.style.transform = `translateY(${-3 * Math.max(0, Math.sin(t * 7 - i * 0.9))}px)`
                                d.style.opacity = String(
                                    0.5 + 0.5 * Math.max(0, Math.sin(t * 7 - i * 0.9)),
                                )
                            })
                            continue
                        }
                        const p = outQuart((t - m.at) / 0.34)
                        const from = m.typing ? m.th : 0
                        m.wrap.style.height = p >= 1 ? "auto" : `${from + (m.h - from) * p}px`
                        m.typingEl.style.display = p > 0.45 ? "none" : "block"
                        m.typingEl.style.opacity = String(1 - p * 2.2)
                        set(m.inner, {
                            opacity: String(clamp(p * 1.6)),
                            transform: `translateY(${(1 - p) * 10}px) scale(${0.96 + 0.04 * p})`,
                            transformOrigin: m.out ? "100% 100%" : "0 100%",
                        })
                    }
                    for (const c of chats) {
                        const layer = $(`chat-${c}`)
                        const kb = (s.keyboard && c === cur && t >= (msgById.k1?.at ?? 0)) || false
                        layer.querySelector(".replykb").style.display = kb ? "block" : "none"
                        layer.querySelector(".msgs").style.bottom = kb ? "128px" : "54px"
                    }
                }

                function renderApp(s, u) {
                    const appEl = $("app")
                    const p = outQuart(u / TR)
                    let show =
                        s.kind === "app" ||
                        (s.kind === "sheet" && !s.overChat) ||
                        (s.kind === "chat" && s.enter === "down" && u < TR) ||
                        (s.kind === "chat" &&
                            s.enter === "fade" &&
                            s.prev?.kind === "app" &&
                            u < TR)
                    set(appEl, {
                        display: show ? "block" : "none",
                        transform: "none",
                        opacity: "1",
                    })
                    $("apptitle").textContent = s.appTitle ?? ""
                    set(imgA, { transform: "none", opacity: "1" })
                    set(imgB, { transform: "none", opacity: "1" })
                    $("shadeA").style.opacity = "0"
                    $("shadeB").style.opacity = "0"
                    setSrc(imgTop, null)
                    setSrc(imgB, null)
                    setSrc(imgA, s.img)
                    if (!show) return
                    if (s.kind === "chat" && s.enter === "fade") {
                        // another person's phone: the app fades into their chat
                        appEl.style.opacity = String(1 - p)
                        return
                    }
                    if (s.kind === "chat") {
                        // back to the chat: the app slides away
                        setSrc(imgA, s.img)
                        appEl.style.transform = `translateY(${inQuad(u / TR) * 896}px)`
                        return
                    }
                    if (s.kind === "sheet") return
                    switch (s.enter) {
                        case "up":
                            appEl.style.transform = `translateY(${(1 - p) * 896}px)`
                            break
                        case "fadein":
                            appEl.style.opacity = String(p)
                            break
                        case "push":
                            if (u < TR && s.prevImg) {
                                setSrc(imgB, s.prevImg)
                                imgB.style.transform = `translateX(${-110 * p}px)`
                                $("shadeB").style.opacity = String(0.12 * p)
                                imgA.style.transform = `translateX(${(1 - p) * 390}px)`
                            }
                            break
                        case "fade":
                            if (u < TR && s.prevImg) {
                                setSrc(imgB, s.prevImg)
                                imgA.style.opacity = String(p)
                            }
                            break
                        case "rise":
                            if (u < TR && s.prevImg) {
                                setSrc(imgB, s.prevImg)
                                $("shadeB").style.opacity = String(0.3 * p)
                                imgA.style.transform = `translateY(${(1 - p) * 844}px)`
                            }
                            break
                        case "drop":
                            if (u < TR && s.prevImg) {
                                setSrc(imgTop, s.prevImg)
                                imgTop.style.transform = `translateY(${inQuad(u / TR) * 844}px)`
                            }
                            break
                    }
                }

                function renderSheets(s, u) {
                    for (const el of $("sheets").children) el.style.display = "none"
                    const show = (id, k) => {
                        const el = $(`sheet-${id}`)
                        el.style.display = "block"
                        const bg = el.querySelector(".sheetbg"),
                            sh = el.querySelector(".sheet"),
                            dl = el.querySelector(".dialog")
                        bg.style.opacity = String(k)
                        if (sh) sh.style.transform = `translateY(${(1 - k) * 560}px)`
                        if (dl) {
                            dl.style.opacity = String(clamp(k * 1.4))
                            dl.style.transform = `scale(${0.88 + 0.12 * k})`
                        }
                    }
                    if (s.kind === "sheet") show(s.sheet, outQuart(u / TR))
                    else if (
                        s.prev?.kind === "sheet" &&
                        (s.enter === "sheetdown" || s.enter === "undialog") &&
                        u < TR
                    )
                        show(s.prev.sheet, 1 - inOut(u / (TR * 0.8)))
                }

                function renderFinger(t, roleSteps) {
                    const f = $("finger"),
                        r = $("ripple")
                    f.style.display = "none"
                    r.style.display = "none"
                    for (const s of roleSteps) {
                        if (!s.tap) continue
                        const at = s.end - 0.16
                        if (t < at - 0.55 || t > at + 0.4) continue
                        // Where the finger landed stays put while the next screen comes in.
                        const p = t <= s.end || !s._pt ? tapPoint(s) : s._pt
                        if (t <= s.end) s._pt = p
                        if (!p) continue
                        const appear = outQuart((t - (at - 0.55)) / 0.2)
                        const press =
                            t < at
                                ? outQuart((t - (at - 0.14)) / 0.14)
                                : 1 - outQuart((t - at) / 0.22)
                        const leave = 1 - clamp((t - (at + 0.15)) / 0.25)
                        set(f, {
                            display: "block",
                            left: `${p.x}px`,
                            top: `${p.y}px`,
                            opacity: String(appear * leave),
                            transform: `scale(${(1.25 - 0.25 * appear) * (1 - 0.18 * clamp(press))})`,
                        })
                        if (t >= at) {
                            const q = clamp((t - at) / 0.42)
                            const rad = 14 + 46 * outQuart(q)
                            set(r, {
                                display: "block",
                                left: `${p.x - rad}px`,
                                top: `${p.y - rad}px`,
                                width: `${rad * 2}px`,
                                height: `${rad * 2}px`,
                                opacity: String(0.9 * (1 - q)),
                            })
                        }
                        break
                    }
                }

                let shownCap = null
                function capHtml(s, r) {
                    return `<div class="who"><i></i>${s.whoNow ?? ""}</div><div class="line"><div class="n">${s.capN}</div><div class="t">${s.caption}</div></div>`
                }
                function renderCaption(t, s, r) {
                    const A = $("capA"),
                        B = $("capB")
                    const cs = s.capStep
                    if (!cs || cs.role !== r.index) {
                        A.style.opacity = "0"
                        B.style.opacity = "0"
                        return
                    }
                    const prevCap = r.steps.filter((x) => x.caption && x.start < cs.start).at(-1)
                    const since = t - cs.start
                    if (A.dataset.k !== String(cs.start)) {
                        A.dataset.k = String(cs.start)
                        A.innerHTML = capHtml(cs, r)
                    }
                    // The person line follows the step, the caption its own step.
                    A.querySelector(".who").innerHTML = `<i></i>${s.whoNow ?? ""}`
                    if (prevCap && since < 0.64) {
                        if (B.dataset.k !== String(prevCap.start)) {
                            B.dataset.k = String(prevCap.start)
                            B.innerHTML = capHtml(prevCap, r)
                        }
                        const out = clamp(since / 0.22)
                        set(B, {
                            opacity: String(1 - out),
                            transform: `translateY(${-24 * out}px)`,
                        })
                        B.querySelector(".who").style.opacity = "0"
                    } else {
                        B.style.opacity = "0"
                    }
                    const inn = prevCap ? outQuart((since - 0.24) / 0.4) : 1
                    set(A, {
                        opacity: String(inn),
                        transform: `translateY(${(1 - inn) * 30}px)`,
                    })
                    $("dots").innerHTML = Array.from(
                        { length: r.caps },
                        (_, i) => `<b class="${i + 1 === cs.capN ? "on" : ""}"></b>`,
                    ).join("")
                }

                function render(t) {
                    // Background drift
                    set($("blob1"), {
                        left: `${-160 + 120 * Math.sin(t * 0.21)}px`,
                        top: `${220 + 90 * Math.cos(t * 0.17)}px`,
                    })
                    set($("blob2"), {
                        left: `${640 + 100 * Math.cos(t * 0.19)}px`,
                        top: `${1180 + 120 * Math.sin(t * 0.13)}px`,
                    })

                    // Intro
                    const intro = $("intro")
                    if (t < INTRO + 0.1) {
                        intro.style.display = "flex"
                        const out = clamp((t - (INTRO - 0.55)) / 0.55)
                        set(intro, {
                            opacity: String(1 - out),
                            transform: `translateY(${-40 * inQuad(out)}px)`,
                        })
                        const logo = outBack((t - 0.2) / 0.7)
                        set(intro.querySelector(".logo"), {
                            opacity: String(clamp((t - 0.2) / 0.35)),
                            transform: `scale(${0.82 + 0.18 * logo})`,
                        })
                        const h = outQuart((t - 0.7) / 0.6)
                        set(intro.querySelector("h1"), {
                            opacity: String(h),
                            transform: `translateY(${(1 - h) * 30}px)`,
                        })
                        const sb = outQuart((t - 1.0) / 0.6)
                        set(intro.querySelector(".sub"), {
                            opacity: String(sb),
                            transform: `translateY(${(1 - sb) * 24}px)`,
                        })
                        const introRows = $("introrows").children.length
                        Array.from({ length: introRows }).forEach((_, i) => {
                            const k = SOLO
                                ? outQuart((t - 1.3 - i * 0.2) / 0.5)
                                : outQuart((t - 1.5 - i * 0.28) / 0.6)
                            set($(`ir${i}`), {
                                opacity: String(k),
                                transform: `translateX(${(1 - k) * 80}px)`,
                            })
                        })
                    } else intro.style.display = "none"

                    // Outro
                    const outro = $("outro")
                    if (t >= OUTRO_START - 0.05) {
                        outro.style.display = "flex"
                        const u = t - OUTRO_START
                        const logo = outBack(u / 0.7)
                        set(outro.querySelector(".logo"), {
                            opacity: String(clamp(u / 0.35)),
                            transform: `scale(${0.82 + 0.18 * logo})`,
                        })
                        const h = outQuart((u - 0.45) / 0.6)
                        set(outro.querySelector("h2"), {
                            opacity: String(h),
                            transform: `translateY(${(1 - h) * 30}px)`,
                        })
                        Array.from({ length: $("outrorows").children.length }, (_, i) => i).forEach(
                            (i) => {
                                const k = outQuart((u - 0.9 - i * 0.25) / 0.6)
                                set($(`or${i}`), {
                                    opacity: String(k),
                                    transform: `translateX(${(1 - k) * 80}px)`,
                                })
                            },
                        )
                        const sk = outBack((u - 1.9) / 0.6)
                        set(outro.querySelector(".site"), {
                            opacity: String(clamp((u - 1.9) / 0.3)),
                            transform: `scale(${0.85 + 0.15 * sk})`,
                        })
                        const fade = clamp((t - (DURATION - 0.6)) / 0.6)
                        outro.style.opacity = String(1 - fade * 0.0)
                    } else outro.style.display = "none"

                    // Role card and body
                    const r = [...roles].reverse().find((x) => t >= x.cardStart - 0.01)
                    const card = $("card"),
                        phone = $("phone"),
                        top = $("top"),
                        caps = $("caps"),
                        dots = $("dots")
                    if (!r || t >= OUTRO_START) {
                        card.style.display = "none"
                        phone.style.display = "none"
                        const k = r ? 1 - clamp((t - OUTRO_START + 0.2) / 0.3) : 0
                        set(top, { opacity: String(r ? k : 0) })
                        caps.style.opacity = String(r ? k : 0)
                        dots.style.opacity = String(r ? k : 0)
                        return
                    }
                    const role = ROLES[r.index]
                    // Card
                    const cu = t - r.cardStart
                    if (!SOLO && cu < CARD + 0.1) {
                        card.style.display = "flex"
                        if (card.dataset.r !== String(r.index)) {
                            card.dataset.r = String(r.index)
                            $("cardicon").innerHTML = svg(role.icon)
                            $("cardnum").textContent = `${r.index + 1} / 3`
                            $("cardname").textContent = role.name
                            $("cardsub").textContent = role.sub
                        }
                        const inK = outQuart(cu / 0.5)
                        const outK = clamp((cu - (CARD - 0.45)) / 0.45)
                        set(card, {
                            opacity: String(inK * (1 - outK)),
                            transform: `translateY(${(1 - inK) * 40 - 120 * inQuad(outK)}px)`,
                        })
                        const tile = outBack(cu / 0.6)
                        set($("cardicon"), {
                            transform: `scale(${0.7 + 0.3 * tile}) rotate(${(1 - tile) * -8}deg)`,
                        })
                    } else card.style.display = "none"

                    // Header and caption
                    $("rolechip").textContent = SOLO ? role.name : `${r.index + 1}/3 · ${role.name}`
                    const headK =
                        outQuart((t - (r.bodyStart - 0.5)) / 0.5) *
                        (1 - clamp((t - r.bodyEnd) / 0.35))
                    set(top, { opacity: String(headK) })
                    caps.style.opacity = String(headK)
                    dots.style.opacity = String(headK)

                    // Phone
                    const enterK = outQuart((t - (r.bodyStart - 0.6)) / 0.6)
                    const exitK = inQuad((t - r.bodyEnd) / 0.45)
                    const S = 1.5
                    const float = Math.sin(t * 0.9) * 4
                    if (enterK <= 0 || exitK >= 1) {
                        phone.style.display = "none"
                        return
                    }
                    set(phone, {
                        display: "block",
                        transform: `translateY(${(1 - enterK) * 1500 + exitK * 1500 + float}px) scale(${S})`,
                    })

                    const tt = clamp(t, r.bodyStart, r.bodyEnd - 0.001)
                    const s = r.steps.find((x) => tt >= x.start && tt < x.end) ?? r.steps.at(-1)
                    const u = tt - s.start
                    renderChats(tt, s, u)
                    renderApp(s, u)
                    renderSheets(s, u)
                    renderFinger(tt, r.steps)
                    renderCaption(tt, s, r)
                }

                window.DURATION = DURATION
                window.render = async (t) => {
                    render(t)
                    while (pending.length) await pending.shift()
                    render(t)
                }
                window.TIMELINE = {
                    duration: DURATION,
                    roles: roles.map((r) => ({
                        card: r.cardStart,
                        body: r.bodyStart,
                        end: r.bodyEnd,
                    })),
                    taps: steps.filter((s) => s.tap).map((s) => s.end - 0.16),
                    messages: Object.values(msgById)
                        .filter((m) => m.at < Infinity)
                        .map((m) => ({ at: m.at, out: !!m.out })),
                    outro: OUTRO_START,
                    // When each role is done: the Zumda sound rings.
                    done: roles.map((r) =>
                        r.index === 0
                            ? msgById.b4.at
                            : r.steps.at(-1).start + (r.index === 1 ? 0.15 : 0.3),
                    ),
                    steps: steps.map((x) => ({
                        k: x.kind,
                        img: x.img,
                        chat: x.chat,
                        s: +x.start.toFixed(2),
                        e: +x.end.toFixed(2),
                    })),
                }
                render(0)
                window.READY = true
            }
            main().catch((e) => {
                document.title = "ERROR " + e.message
                console.error(e)
            })
        </script>
    </body>
</html>

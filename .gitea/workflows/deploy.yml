name: Deploy LLS

on:
    push:
        branches: [main]

jobs:
    quality-gate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.2.4"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Lint
              run: bun run lint

            - name: Test
              run: bun run test

    deploy-api:
        needs: quality-gate
        runs-on: ubuntu-latest
        steps:
            - name: Deploy API
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      cd /projects/apps/lls
                      git pull origin main
                      bun install --frozen-lockfile
                      bun run --filter @lls/core build
                      bun run --filter @lls/api build
                      pm2 restart lls-api || pm2 start deploy/ecosystem.config.cjs --only lls-api

    deploy-bot:
        needs: quality-gate
        runs-on: ubuntu-latest
        steps:
            - name: Deploy Bot
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      cd /projects/apps/lls
                      git pull origin main
                      bun install --frozen-lockfile
                      bun run --filter @lls/core build
                      bun run --filter @lls/bot build
                      # Static files served by Nginx

    deploy-admin:
        needs: quality-gate
        runs-on: ubuntu-latest
        steps:
            - name: Deploy Admin
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      cd /projects/apps/lls
                      git pull origin main
                      bun install --frozen-lockfile
                      bun run --filter @lls/core build
                      bun run --filter @lls/admin build
                      # Static files served by Nginx

    notify:
        needs: [deploy-api, deploy-bot, deploy-admin]
        runs-on: ubuntu-latest
        if: always()
        steps:
            - name: Discord Notification
              uses: sarisia/actions-status-discord@v1
              with:
                  webhook: ${{ secrets.DISCORD_WEBHOOK }}
                  status: ${{ job.status }}
                  title: "LLS Deployment"
                  description: |
                      Branch: ${{ github.ref_name }}
                      Commit: ${{ github.sha }}
